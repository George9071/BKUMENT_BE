version: '3.8'

services:
  postgres:
    image: postgres:17-alpine
    container_name: postgres_db
    restart: always
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=bkument
      - POSTGRES_PASSWORD=bkument_thesis_252
      - POSTGRES_DB=bkument_db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bkument -d bkument_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  api-gateway:
    build: api-gateway/.                          
    container_name: bkument_api_gateway
    restart: on-failure               
    ports:
      - "8888:8888"      
    depends_on:
      - identity-service
      - resource-service     
    environment:
      - SERVER_PORT=8888    
      - IDENTITY_URI=http://identity-service:8080
      - RESOURCE_URI=http://resource-service:8084

  resource-service:
    build: resource-service/.                          
    container_name: bkument_resource_service
    restart: on-failure                         
    depends_on:
      postgres:
        condition: service_healthy    
    environment:
      - SERVER_PORT=8084 
      - DB_HOST=postgres
      - DB_NAME=bkument_db
      - DB_USER=bkument
      - DB_PASSWORD=bkument_thesis_252
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update
      - SERVER_PORT=8084
    ports:
      - "8084:8084"

  identity-service:
    build: identity-service/.                      
    container_name: bkument_identity_service
    restart: on-failure                            
    depends_on:
      postgres:
        condition: service_healthy    
    environment:
      - DB_HOST=postgres
      - DB_NAME=bkument_db
      - DB_USER=bkument
      - DB_PASSWORD=bkument_thesis_252
      - SPRING_JPA_HIBERNATE_DDL_AUTO=update