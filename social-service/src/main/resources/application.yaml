server:
  port: 8089
  servlet:
    context-path: /social

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/bkument_db
    driverClassName: org.postgresql.Driver
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    openfeign:
      client:
        config:
          ai-service:
            connect-timeout: 60000
            read-timeout: 1200000
  neo4j:
    uri: bolt://${DB_HOST}:7687
    authentication:
      username: ${NEO4J_USERNAME}
      password: ${NEO4J_PASSWORD}

logging:
  level:
    org.hibernate.orm.connections.pooling: DEBUG
    com.zaxxer.hikari: DEBUG

# Gateway Configuration
gateway:
  base-url: http://localhost:8888
  api-prefix: /api/v1

# Swagger Configuration
swagger:
  gateway-url: ${BACKEND_HOST}/api/v1/social
  host-url: http://localhost:8089/social

app:
  services:
    profile: http://localhost:8081/profile
    document: http://localhost:8086/document
    blog: http://localhost:8085/blog
    lms: http://localhost:8082/lms
    email: http://localhost:8084/email