server:
  port: 8090
  servlet:
    context-path: /resource

# MinIO Configuration
minio:
  endpoint: http://${MINIO_HOST}:9000
  external-endpoint: ${MINIO_EXTERNAL_URL:http://${MINIO_HOST}:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME}
  secure: false

# Swagger Configuration
swagger:
  gateway-url: ${BACKEND_HOST}/api/v1/resource
  host-url: http://localhost:8090/resource
