server:
  port: 8085
  servlet:
    context-path: /blog

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/bkument_db
    driverClassName: org.postgresql.Driver
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BROKERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.json.trusted.packages: "vn.edu.hcmut.event"
        spring.json.use.type.headers: false

logging:
  level:
    org.hibernate.orm.connections.pooling: DEBUG
    com.zaxxer.hikari: DEBUG

minio:
  endpoint: http://${MINIO_HOST}:9000
  external-endpoint: ${MINIO_EXTERNAL_URL:http://${MINIO_HOST}:9000}
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME}
  secure: false

gateway:
  base-url: http://localhost:8888
  api-prefix: /api/v1

swagger:
  gateway-url: ${BACKEND_HOST}/api/v1/blog
  host-url: http://localhost:8085/blog

app:
  services:
    profile: http://localhost:8081/profile
    social: http://localhost:8089/social
  internal-api:
    secret: ${INTERNAL_API_SECRET}

  trending:
    w1: 100.0
    w2: 1.0
    w3: 5.0
    gravity: 1.8
