server:
  port: 8085
  servlet:
    context-path: /blog

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/bkument_db
    driverClassName: org.postgresql.Driver
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    org.hibernate.orm.connections.pooling: DEBUG
    com.zaxxer.hikari: DEBUG

minio:
  endpoint: http://${MINIO_HOST}:9000
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME}
  secure: false

gateway:
  base-url: http://localhost:8888
  api-prefix: /api/v1

swagger:
  gateway-url: http://localhost:8888/api/v1/blog
  host-url: http://localhost:8085/blog

app:
  services:
    profile: http://localhost:8081/profile
    social: http://localhost:8089/social

  trending:
    w1: 100.0
    w2: 1.0
    w3: 5.0
    gravity: 1.8