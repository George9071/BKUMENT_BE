spring:
  application:
    name: communication-service
  data:
    mongodb:
      uri: mongodb://bkument_admin:bkument_thesis_252@127.0.0.1:27018/communication?authSource=admin
      auto-index-creation: true
  kafka:
    bootstrap-servers: localhost:9094

    consumer:
      group-id: communication-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.value.default.type: vn.edu.hcmut.notification.event.EnrollmentNotificationEvent
        spring.json.trusted.packages: vn.edu.hcmut.notification.event
        spring.json.use.type.headers: false

ssh:
  tunnel:
    enabled: false
    host: 206.189.92.152
    port: 22
    user: root
    password: BKUMENT_THESIS_252
    local-port: 27018
    remote-port: 27017

server:
  port: 8083
  servlet:
    context-path: /communication

app:
  services:
    identity:
      url: http://localhost:8080/identity
    profile:
      url: http://localhost:8081/profile
    lms:
      url: http://localhost:8082/lms

swagger:
  host-url: http://localhost:8083/communication
