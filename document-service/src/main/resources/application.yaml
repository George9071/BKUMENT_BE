server:
  port: 8086
  servlet:
    context-path: /document

spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/bkument_db
    driverClassName: org.postgresql.Driver
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    openfeign:
      client:
        config:
          ai-service:
            connect-timeout: 60000
            read-timeout: 1200000
  neo4j:
    uri: bolt://${DB_HOST:localhost}:7687
    authentication:
      username: ${NEO4J_USERNAME}
      password: ${NEO4J_PASSWORD}
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
    consumer:
      group-id: document-graph-sync-group
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
      auto-offset-reset: earliest

logging:
  level:
    org.hibernate.orm.connections.pooling: DEBUG
    com.zaxxer.hikari: DEBUG

minio:
  endpoint: http://${MINIO_HOST}:9000
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME}
  secure: false

gateway:
  base-url: http://${PUBLIC_IP}:8888
  api-prefix: /api/v1

swagger:
  gateway-url: http://${PUBLIC_IP}:8888/api/v1/document
  host-url: http://${PUBLIC_IP}:8086/document

app:
  services:
    ai: http://localhost:8087/ai
    profile: http://localhost:8081/profile
    social: http://localhost:8089/social
    lms: http://localhost:8082/lms
  ranking:
    weight-rating: 0.7
    weight-download: 0.3
    weight-view: 0.1
    gravity: 1.5
    window-days: 90
  hybrid:
    threshold-words: 10
    weight-semantic-short: 0.2
    weight-cf-short: 0.8
    weight-semantic-long: 0.7
    weight-cf-long: 0.3