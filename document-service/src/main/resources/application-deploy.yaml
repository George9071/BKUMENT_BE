spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST}:5432/bkument_db
    driverClassName: org.postgresql.Driver
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 5
      minimum-idle: 2
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  cloud:
    openfeign:
      client:
        config:
          ai-service:
            connect-timeout: 60000
            read-timeout: 1200000
  neo4j:
    uri: bolt://${DB_HOST:localhost}:7687
    authentication:
      username: ${NEO4J_USERNAME}
      password: ${NEO4J_PASSWORD}
  kafka:
    bootstrap-servers: kafka:9092

minio:
  endpoint: http://${MINIO_HOST}:9000
  access-key: ${MINIO_ACCESS_KEY}
  secret-key: ${MINIO_SECRET_KEY}
  bucket-name: ${MINIO_BUCKET_NAME}
  secure: false

gateway:
  base-url: http://${PUBLIC_IP}:8888
  api-prefix: /api/v1

swagger:
  gateway-url: http://${PUBLIC_IP}:8888/api/v1/document
  host-url: http://${PUBLIC_IP}:8086/document

app:
  services:
    ai: http://ai-service:8087/ai
    profile: http://profile-service:8081/profile
    social: http://social-service:8089/social
  ranking:
    weight-download: 0.3
  hybrid:
    threshold-words: 10
    weight-semantic-short: 0.2
    weight-cf-short: 0.8
    weight-semantic-long: 0.7
    weight-cf-long: 0.3