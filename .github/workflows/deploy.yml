name: Deploy BKUMENT BE

on:
  push:
    branches: [ "main" ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3
      
    # ================= JAVA =================
    - name: Set up JDK 21
      uses: actions/setup-java@v3
      with:
        java-version: '21'   
        distribution: 'temurin'
        cache: maven
        
    - name: Build all Java microservices
      run: |
        for dir in */ ; do
          if [ -f "$dir/pom.xml" ]; then
            echo "🚀 build service: $dir"
            (cd "$dir" && mvn clean package -DskipTests)
          fi
        done

    # ================= PYTHON =================
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: "3.11"

    - name: Validate Python service (optional but good)
      run: |
        if [ -f "ai-service/requirements.txt" ]; then
          echo "🐍 Installing Python deps for validation..."
          pip install -r ai-service/requirements.txt
        fi

    # ================= DEPLOY =================
    - name: Copy files to DigitalOcean
      uses: appleboy/scp-action@v0.1.4
      with:
        host: ${{ secrets.DO_HOST }}
        username: ${{ secrets.DO_USERNAME }}
        password: ${{ secrets.DO_PASSWORD }}
        
        source: |
          docker-compose.yml
          api-gateway/target
          api-gateway/Dockerfile
          social-service/target
          social-service/Dockerfile
          ai-service
        target: "/root/bkument-backend" 

    - name: Execute SSH to restart Docker
      uses: appleboy/ssh-action@v1.0.0
      with:
        host: ${{ secrets.DO_HOST }}
        username: ${{ secrets.DO_USERNAME }}
        password: ${{ secrets.DO_PASSWORD }}
        script: |
          cd /root/bkument-backend
          docker compose down
          docker compose up -d --build
