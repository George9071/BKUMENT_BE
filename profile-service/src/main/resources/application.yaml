server:
  port: 8081
  servlet:
    context-path: /profile

spring:
  neo4j:
    uri: bolt://${DB_HOST:localhost}:7687
    authentication:
      username: ${NEO4J_USERNAME}
      password: ${NEO4J_PASSWORD}
  datasource:
    url: "jdbc:postgresql://${DB_HOST:localhost}:5432/bkument_db"
    driverClassName: "org.postgresql.Driver"
    username: ${POSTGRES_USERNAME}
    password: ${POSTGRES_PASSWORD}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 4
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.header: false
    consumer:
      key-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.key.delegate.class: org.apache.kafka.common.serialization.StringDeserializer
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: "vn.edu.hcmut.event"
        spring.json.use.type.headers: false

swagger:
  host-url: http://localhost:8081/profile
  gateway-url: ${BACKEND_HOST}/api/v1/profile

jwt:
  signerKey: ${JWT_SIGNER_KEY}