spring:
  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: internal_blocked
              uri: no://op
              order: -1
              predicates:
                - Path=${app.api-prefix}/*/internal/**
              filters:
                - SetStatus=404

            - id: identity_service
              uri: http://identity-service:8080
              predicates:
                - Path=${app.api-prefix}/identity/**
              filters:
                - StripPrefix=2
                - RemoveRequestHeader=Origin

            - id: profile_service
              uri: http://profile-service:8081
              predicates:
                - Path=${app.api-prefix}/profile/**
              filters:
                - StripPrefix=2

            - id: lms_service
              uri: http://lms-service:8082
              predicates:
                - Path=${app.api-prefix}/lms/**
              filters:
                - StripPrefix=2
                - RemoveRequestHeader=Origin

            - id: communication_service
              uri: http://communication-service:8083
              predicates:
                - Path=${app.api-prefix}/communication/**
              filters:
                - StripPrefix=2
                -
            - id: email_service
              uri: http://email-service:8084
              predicates:
                - Path=${app.api-prefix}/email/**
              filters:
                - StripPrefix=2
                -
            - id: blog_service
              uri: http://blog-service:8085
              predicates:
                - Path=${app.api-prefix}/blog/**
              filters:
                - StripPrefix=2

            - id: document_service
              uri: http://document-service:8086
              predicates:
                - Path=${app.api-prefix}/document/**
              filters:
                - StripPrefix=2

            - id: social_service
              uri: http://social-service:8089
              predicates:
                - Path=${app.api-prefix}/social/**
              filters:
                - StripPrefix=2

            - id: resource_service
              uri: http://resource-service:8090
              predicates:
                - Path=${app.api-prefix}/resource/**
              filters:
                - StripPrefix=2

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:5173
              - http://localhost:3000
              - https://bkument-fe.vercel.app
              - http://${PUBLIC_IP}:8888
            allowedMethods: "*"
            allowedHeaders: "*"
            allow-credentials: true

swagger:
  host-url: http://${PUBLIC_IP}:8888

app:
  services:
    identity:
      url: http://identity-service:8080/identity