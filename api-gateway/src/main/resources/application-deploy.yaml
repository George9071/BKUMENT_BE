server:
  port: 8888

app:
  api-prefix: /api/v1

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: identity_service
              uri: ${IDENTITY_URI:https://bkment-identity-service-latest.onrender.com}
              predicates:
                - Path=${app.api-prefix}/identity/**
              filters:
                - StripPrefix=2
            - id: resource_service
              uri: ${RESOURCE_URI:https://bkment-resource-service-latest.onrender.com/}
              predicates:
                - Path=${app.api-prefix}/resource/**
              filters:
                - StripPrefix=2

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:5173
              - http://localhost:3000
              - https://bkument-fe.vercel.app/
            allowedMethods: "*"
            allowedHeaders: "*"
            allow-credentials: true
