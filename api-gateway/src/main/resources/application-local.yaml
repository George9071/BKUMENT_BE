server:
  port: 8888

app:
  api-prefix: /api/v1

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            - id: resource_service
              uri: http://localhost:8084
              predicates:
                - Path=${app.api-prefix}/resource/**
              filters:
                - StripPrefix=2

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:5173
            allowedMethods: "*"
            allowedHeaders: "*"
            allow-credentials: true
