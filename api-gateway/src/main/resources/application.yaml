server:
  port: 8888

app:
  api-prefix: /api/v1

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:
            # GLOBAL BLOCKER
            - id: internal_blocked
              uri: no://op
              order: -1
              predicates:
                - Path=${app.api-prefix}/*/internal/**
              filters:
                - SetStatus=404

            # SERVICE ROUTES
            - id: identity_service
              uri: http://localhost:8080
              predicates:
                - Path=${app.api-prefix}/identity/**
              filters:
                - StripPrefix=2
                - RemoveRequestHeader=Origin
            - id: profile_service
              uri: http://localhost:8081
              predicates:
                - Path=${app.api-prefix}/profile/**
              filters:
                - StripPrefix=2
            - id: resource_service
              uri: http://localhost:8082
              predicates:
                - Path=${app.api-prefix}/resource/**
              filters:
                - StripPrefix=2
            - id: blog_service
              uri: http://localhost:8085
              predicates:
                - Path=${app.api-prefix}/blog/**
              filters:
                - StripPrefix=2
            - id: document_service
              uri: http://localhost:8086
              predicates:
                - Path=${app.api-prefix}/document/**
              filters:
                - StripPrefix=2
            - id: ai_service
              uri: http://localhost:8087
              predicates:
                - Path=${app.api-prefix}/ai/**
              filters:
                - StripPrefix=2
            - id: lms_service
              uri: http://localhost:8088
              predicates:
                - Path=${app.api-prefix}/lms/**
              filters:
                - StripPrefix=2
                - RemoveRequestHeader=Origin

      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - http://localhost:5173
              - http://localhost:3000
              - https://bkument-fe.vercel.app/
              - http://localhost:8888
            allowedMethods: "*"
            allowedHeaders: "*"
            allow-credentials: true

springdoc:
  swagger-ui:
    # Helper to clean up the UI
    use-root-path: true
    # List the services want to display in the dropdown
    urls:
      - name: Identity Service
        url: /api/v1/identity/v3/api-docs/public
      - name: Profile Service
        url: /api/v1/profile/v3/api-docs/public
#      - name: Resource Service
#        url: /api/v1/resource/v3/api-docs

swagger:
  host-url: http://localhost:8888